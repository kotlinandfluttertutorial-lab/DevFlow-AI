name: Security

on:
  pull_request:
    branches: [develop, main]
  schedule:
    - cron: "0 2 * * 1"

permissions:
  contents: read

jobs:
  dependency-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pip-audit==2.10.1
      - run: python -m pip_audit -r requirements/base.txt --format json
  secret-detection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Scan tracked files for candidate secrets (offline, no verification egress)
        run: |
          scan_root="$(mktemp -d)"
          git archive HEAD | tar -xf - -C "$scan_root"
          docker run --rm --network none \
            -v "$scan_root:/scan:ro" \
            trufflesecurity/trufflehog:3.90.0 \
            filesystem /scan \
              --no-update \
              --no-verification \
              --fail \
              --json 2>/dev/null \
            | python3 -c "
import sys, json
findings = []
for line in sys.stdin:
    line = line.strip()
    if not line:
        continue
    try:
        obj = json.loads(line)
    except json.JSONDecodeError:
        continue
    det = obj.get('DetectorName', 'unknown')
    file_ = obj.get('SourceMetadata', {}).get('Data', {}).get('Filesystem', {}).get('file', 'unknown')
    findings.append({'detector': det, 'file': file_})
if findings:
    for f in findings:
        print(f'FINDING: detector={f[\"detector\"]} file={f[\"file\"]}')
    sys.exit(1)
print('No candidate secrets found.')
"
  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install bandit[toml]==1.9.4
      - run: python -m bandit -c pyproject.toml -r src/ -ll -f json -o bandit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-report
          path: bandit.json
